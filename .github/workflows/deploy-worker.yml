name: Deploy quest-api Worker

# Idempotent bootstrap + deploy. Trigger from the Actions tab.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN     - "Edit Cloudflare Workers" token
#   CLOUDFLARE_ACCOUNT_ID    - your Cloudflare account ID
#   JWT_SECRET               - long random string (session JWT signing key)
#   GOOGLE_CLIENT_ID         - OAuth Web client ID (optional on first run;
#                              /health works without it, set later for login)
on:
  workflow_dispatch:
  push:
    branches: [claude/aws-exam-practice-app-mSqvt, main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Ensure D1 database exists and pin its id
        run: |
          set -e
          # Try to find an existing quest_db; create one if missing.
          LIST=$(npx wrangler d1 list 2>&1 || true)
          DB_ID=$(echo "$LIST" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}[^"]*' | head -n1 || true)
          # Better detection: parse JSON output
          LIST_JSON=$(npx wrangler d1 list --json 2>&1 || echo '[]')
          DB_ID=$(node -e "
            const d = JSON.parse(process.argv[1] || '[]');
            const r = (Array.isArray(d) ? d : []).find(x => x.name === 'quest_db');
            process.stdout.write(r ? r.uuid : '');
          " "$LIST_JSON")
          if [ -z "$DB_ID" ]; then
            echo "Creating D1 database 'quest_db'..."
            CREATE_OUT=$(npx wrangler d1 create quest_db)
            echo "$CREATE_OUT"
            DB_ID=$(echo "$CREATE_OUT" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -n1)
          fi
          if [ -z "$DB_ID" ]; then
            echo "ERROR: could not determine D1 database_id"; exit 1
          fi
          echo "D1 database_id = $DB_ID"
          # Inject into wrangler.toml in place for this run (not committed).
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$DB_ID/" wrangler.toml
          grep '^database_id' wrangler.toml

      - name: Apply schema (idempotent, retried; non-fatal on D1 admin-API outage)
        run: |
          set +e
          for i in 1 2 3; do
            npx wrangler d1 execute quest_db --remote --file=./schema.sql && exit 0
            echo "schema apply failed (attempt $i), retrying in $((i*10))s..."
            sleep $((i*10))
          done
          echo "::warning::Schema apply failed 3x (D1 admin API error). Continuing: schema.sql is idempotent and was fully applied by an earlier run. If THIS deploy adds tables/columns, re-run the workflow after D1 recovers."
          echo "### ⚠️ Schema apply skipped this run (D1 admin API failing) — re-run if this deploy changed schema.sql" >> $GITHUB_STEP_SUMMARY
          exit 0

      - name: Set JWT_SECRET
        if: env.JWT_SECRET_VAL != ''
        env:
          JWT_SECRET_VAL: ${{ secrets.JWT_SECRET }}
        run: printf '%s' "$JWT_SECRET_VAL" | npx wrangler secret put JWT_SECRET

      - name: Set GOOGLE_CLIENT_ID
        if: env.GOOGLE_CLIENT_ID_VAL != ''
        env:
          GOOGLE_CLIENT_ID_VAL: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: printf '%s' "$GOOGLE_CLIENT_ID_VAL" | npx wrangler secret put GOOGLE_CLIENT_ID

      - name: Deploy
        id: deploy
        run: |
          OUT=$(npx wrangler deploy)
          echo "$OUT"
          URL=$(echo "$OUT" | grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' | head -n1)
          echo "WORKER_URL=$URL" >> $GITHUB_ENV
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Smoke test /health
        run: |
          set -e
          for i in 1 2 3 4 5; do
            CODE=$(curl -sS -o /tmp/health -w '%{http_code}' "$WORKER_URL/health" || true)
            if [ "$CODE" = "200" ]; then cat /tmp/health; echo; exit 0; fi
            echo "attempt $i: HTTP $CODE — retrying"; sleep 3
          done
          echo "health check failed"; exit 1

      - name: Summary
        run: |
          echo "### quest-api deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- URL: \`$WORKER_URL\`" >> $GITHUB_STEP_SUMMARY
          echo "- Health: \`$WORKER_URL/health\`" >> $GITHUB_STEP_SUMMARY
